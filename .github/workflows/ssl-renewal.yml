name: SSL Certificate Renewal

on:
  schedule:
    - cron: '0 2 * * 1'  # Run weekly on Monday at 2 AM
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  actions: read

env:
  DOMAIN: lucidledger.co

jobs:
  renew-ssl:
    name: Renew SSL Certificates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
      timeout-minutes: 10
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add EC2 to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Renew SSL Certificates
      run: |
        # Create SSL renewal script
        cat > renew-ssl.sh << 'EOF'
        #!/bin/bash
        set -e
        
        DOMAIN="${DOMAIN:-lucidledger.co}"
        
        echo "🔐 Starting SSL certificate renewal..."
        echo "Domain: $DOMAIN"
        
        # Find project directory
        PROJECT_DIR=""
        if [ -d "/home/ec2-user/lucidledger" ]; then
          PROJECT_DIR="/home/ec2-user/lucidledger"
        elif [ -d "/home/ubuntu/lucidledger" ]; then
          PROJECT_DIR="/home/ubuntu/lucidledger"
        else
          echo "❌ Project directory not found. Searching for lucidledger directory..."
          PROJECT_DIR=$(find /home -type d -name "lucidledger" 2>/dev/null | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ Could not find lucidledger directory"
            exit 1
          fi
        fi
        
        echo "📁 Using project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR" || exit 1
        
        # Check if certificates need renewal
        CERT_PATH="ssl/live/$DOMAIN/fullchain.pem"
        if [ -f "$CERT_PATH" ]; then
          echo "📅 Checking certificate expiration..."
          
          # Get expiration date
          EXPIRY=$(openssl x509 -enddate -noout -in "$CERT_PATH" | cut -d= -f2)
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || date -j -f "%b %d %H:%M:%S %Y %Z" "$EXPIRY" +%s 2>/dev/null || echo "0")
          CURRENT_EPOCH=$(date +%s)
          
          # Ensure certbot-webroot directory exists
          mkdir -p certbot-webroot
          
          if [ "$EXPIRY_EPOCH" != "0" ]; then
            if [ "$EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ]; then
              # Certificate is still valid
              DAYS_LEFT=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
              echo "Certificate expires in $DAYS_LEFT days"
              
              if [ $DAYS_LEFT -lt 30 ]; then
                echo "⚠️  Certificate expires soon, renewing..."
                RENEW_NEEDED=true
              else
                echo "✅ Certificates are still valid for $DAYS_LEFT days"
                RENEW_NEEDED=false
              fi
            else
              # Certificate has expired
              DAYS_EXPIRED=$(( (CURRENT_EPOCH - EXPIRY_EPOCH) / 86400 ))
              echo "❌ Certificate expired $DAYS_EXPIRED days ago - URGENT RENEWAL NEEDED!"
              RENEW_NEEDED=true
            fi
          else
            # Could not determine expiration - attempt renewal to be safe
            echo "⚠️  Could not determine certificate expiration, attempting renewal..."
            RENEW_NEEDED=true
          fi
          
          if [ "$RENEW_NEEDED" = "true" ]; then
            # Renew certificates using webroot method
            # Use --force-renewal if certificate is expired
            if [ "$EXPIRY_EPOCH" != "0" ] && [ "$EXPIRY_EPOCH" -le "$CURRENT_EPOCH" ]; then
              echo "🔄 Forcing certificate renewal (certificate expired)..."
              RENEW_CMD="docker compose -f docker-compose.nginx.yml run --rm certbot renew --webroot --webroot-path=/var/www/html --force-renewal"
            else
              RENEW_CMD="docker compose -f docker-compose.nginx.yml run --rm certbot renew --webroot --webroot-path=/var/www/html --quiet"
            fi

            if eval "$RENEW_CMD"; then
              echo "✅ SSL certificates renewed successfully!"

              # Graceful reload — nginx re-reads certs without dropping connections
              docker exec nginx-proxy nginx -s reload
              sleep 3

              # Verify nginx is now serving the renewed certificate
              SERVED_EXPIRY=$(echo | openssl s_client -connect localhost:443 -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
              if [ -n "$SERVED_EXPIRY" ]; then
                echo "✅ Nginx reloaded — serving cert expiring: $SERVED_EXPIRY"
              else
                echo "⚠️  Could not verify served cert — check nginx manually"
              fi
            else
              echo "❌ Certificate renewal failed"
              echo "💡 Trying dry-run to diagnose issue..."
              docker compose -f docker-compose.nginx.yml run --rm certbot renew --webroot --webroot-path=/var/www/html --dry-run || true
              exit 1
            fi
          fi
        else
          echo "❌ No SSL certificates found at $CERT_PATH"
          echo "💡 You may need to run initial certificate setup"
        fi
        
        echo "🔍 Testing HTTPS connection..."
        # Test multiple endpoints to verify HTTPS is working
        HTTPS_WORKING=false
        
        # Test root endpoint
        if curl -f -s --max-time 10 "https://$DOMAIN" > /dev/null 2>&1; then
          echo "✅ HTTPS root endpoint is working"
          HTTPS_WORKING=true
        fi
        
        # Test API health endpoint (more reliable)
        if curl -f -s --max-time 10 "https://$DOMAIN/api/health" > /dev/null 2>&1; then
          echo "✅ HTTPS API endpoint is working"
          HTTPS_WORKING=true
        fi
        
        # Test via localhost (in case domain doesn't resolve from inside EC2)
        if curl -f -s --max-time 10 -k "https://localhost/api/health" > /dev/null 2>&1; then
          echo "✅ HTTPS localhost endpoint is working"
          HTTPS_WORKING=true
        fi
        
        if [ "$HTTPS_WORKING" = "true" ]; then
          echo "✅ HTTPS is working correctly"
        else
          echo "⚠️  HTTPS test failed, but renewal may have succeeded"
          echo "💡 Check manually: curl -I https://$DOMAIN"
        fi
        
        echo "🎉 SSL renewal process completed!"
        EOF
        
        chmod +x renew-ssl.sh
        
        # Execute SSL renewal script on EC2 with DOMAIN environment variable
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "DOMAIN=${{ env.DOMAIN }} bash -s" < renew-ssl.sh
        
    - name: SSL Renewal Status
      run: |
        echo "🔐 SSL certificate renewal completed!"
        echo "🌐 Your app should continue working with valid HTTPS"
        echo "📅 Next renewal check: Next Monday at 2 AM UTC"
